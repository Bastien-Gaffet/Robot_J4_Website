<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Leaderboard</title>
  <link rel="icon" href="images/logo.png" type="image/png">
  <link rel="stylesheet" href="css/global.css" />
  <link rel="stylesheet" href="css/leaderboard.css">
</head>
<body>
  <div class="wrapper">
    <!-- Common navigation bar -->
    <nav class="navbar">
      <div class="nav-container">
        <div class="nav-logo">
          <img src="images/logo.png" alt="Logo" height="40" />
        </div>
        <div class="nav-links">
          <a href="index.html">Home</a>
          <a href="leaderboard.html" class="active">Leaderboard</a>
          <a href="replay.html">Replay</a>
        </div>
      </div>
    </nav>
    <h1>Game Leaderboard</h1>
    <div class="search-container">
      <input type="text" id="searchInput" placeholder="Search a game..." />
    </div>
    <div class="table-container">
      <table id="leaderboard">
        <thead>
          <tr>
            <th data-key="player_pseudo">Username <img class="sort-icon" src="images/svg/sort-neutral.svg" /></th>
            <th data-key="timestamp">Date <img class="sort-icon" src="images/svg/sort-neutral.svg" /></th>
            <th data-key="duration_seconds">Duration <img class="sort-icon" src="images/svg/sort-neutral.svg" /></th>
            <th data-key="ai_depth">AI Level <img class="sort-icon" src="images/svg/sort-neutral.svg" /></th>
            <th data-key="winner">Winner <img class="sort-icon" src="images/svg/sort-neutral.svg" /></th>
            <th>Replay</th>
          </tr>
        </thead>
        <tbody></tbody>
      </table>
    </div>

    <script type="module" src="js/leaderboard.js"></script>

    <!-- Back to Top Button -->
    <button id="backtotopBtn" title="Back to top">↑</button>
    <script src="js/global.js"></script>
  </div>
  
  <!-- Footer -->
  <footer>
    <p>Presented by the Lycée Vaucanson Robot J4 Team<br>from Tours in 2025</p>
  </footer>
</body>
</html>
