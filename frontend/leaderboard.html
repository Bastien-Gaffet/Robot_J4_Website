<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Leaderboard</title>
  <link rel="icon" href="images/logo.png" type="image/png">
  <link rel="stylesheet" href="css/global.css" />
  <link rel="stylesheet" href="css/leaderboard.css">
</head>
<body>
  <!-- Common navigation bar -->
  <nav class="navbar">
    <div class="nav-container">
      <div class="nav-logo">
        <img src="/images/logo.png" alt="Logo" />
      </div>
      <div id="nav-links" class="nav-links"></div>
    </div>
  </nav>

  <h1>Player Leaderboard</h1>
  <div class="table-container">
    <table id="leaderboard">
      <thead>
        <tr>
          <th class="left-align"></th>
          <th class="left-align">Username</th>
          <th class="center-align">Rating</th>
          <th class="center-align">Won</th>
          <th class="center-align">Draw</th>
          <th class="center-align">Lost</th>
        </tr>
      </thead>
      <tbody></tbody>
    </table>
  </div>

  <script type="module" src="js/leaderboard.js"></script>
  <div id="pagination" class="pagination"></div>

  <!-- Back to Top Button -->
  <button id="backtotopBtn" title="Back to top">↑</button>
  <script src="js/global.js"></script>
  
  <!-- Bottom Navigation Bar pour mobile -->
  <nav class="bottom-nav"></nav>
  <script type="module" src="/js/navbar-controller.js"></script>
</body>
</html>
