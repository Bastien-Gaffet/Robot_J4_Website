<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Jouer - Puissance 4</title>
  <link rel="icon" href="images/logo.png" type="image/png" />
  <link rel="stylesheet" href="css/global.css" />
  <link rel="stylesheet" href="css/home.css" />
</head>
<body>
  <!-- Common navigation bar -->
  <nav class="navbar">
    <div class="nav-container">
      <div class="nav-logo">
        <img src="/images/logo.png" alt="Logo" />
      </div>
      <div id="nav-links" class="nav-links"></div>
    </div>
  </nav>
  
  <!-- Mobile top-navigation bar -->
  <div id="top-mobile-navbar" class="top-mobile-navbar"></div>

  <main>
    <h1>Welcome, <span id="userName">...</span></h1>
    <div class="profile-info" id="profileInfo">
      <!-- Infos supplémentaires profil, ex : elo, pseudo -->
    </div>

    <button class="btn" id="btnProfile">View my profile</button>
    <button class="btn" id="btnPlayBot">Play bot</button>
    <button class="btn" id="btnPlayOnline">New game</button>
  </main>

  <script type="module" src="js/auth-guard.js"></script>
  <script type="module" src="js/home.js"></script>

  <!-- Back to Top Button -->
  <button id="backtotopBtn" title="Back to top">↑</button>
  <script src="js/global.js"></script>
  
  <!-- Bottom Navigation Bar pour mobile -->
  <nav class="bottom-nav"></nav>
  <script type="module" src="/js/navbar-controller.js"></script>
</body>
</html>
