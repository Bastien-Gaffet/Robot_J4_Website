<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Player Profile</title>
  <link rel="icon" href="images/logo.png" type="image/png">
  <link rel="stylesheet" href="css/global.css">
  <link rel="stylesheet" href="css/elo.css">
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>
  <div class="wrapper">
    <nav class="navbar">
      <div class="nav-container">
        <div class="nav-logo">
          <img src="images/logo.png" alt="Logo" height="40">
        </div>
        <div class="nav-links">
          <a href="index.html">Home</a>
          <a href="leaderboard.html">Leaderboard</a>
          <a href="game-history.html">Game history</a>
        </div>
      </div>
    </nav>

    <h1 id="playerName">Profile Player1</h1>

    <div class="filter-buttons">
      <button data-range="7">7 days</button>
      <button data-range="30">30 days</button>
      <button data-range="90" class="active">90 days</button>
      <button data-range="365">1 year</button>
      <button data-range="all">Total</button>
    </div>

    <div id="playerSummary" class="player-summary">
      <p>Elo : <span id="currentElo">...</span></p>
      <p>Global ranking : <span id="globalRank">...</span></p>
    </div>

    <canvas id="eloChart" width="1000" height="500"></canvas>
  </div>
  <script type="module" src="js/elo.js"></script>
    <!-- Bottom Navigation Bar pour mobile -->
  <nav class="bottom-nav">
    <a href="index.html" class="nav-item" aria-label="Home">
      <svg class="icon" viewBox="0 0 24 24"><!-- icône home --><path d="M3 12l9-9 9 9v9a1 1 0 0 1-1 1h-5v-6h-6v6H4a1 1 0 0 1-1-1v-9z"/></svg>
      <span class="label">Home</span>
    </a>
    <a href="replay.html" class="nav-item" aria-label="Play">
      <svg class="icon" viewBox="0 0 24 24"><!-- icône play --><path d="M8 5v14l11-7z"/></svg>
      <span class="label">Play</span>
    </a>
    <a href="leaderboard.html" class="nav-item active" aria-label="Leaderboard">
      <svg class="icon" viewBox="0 0 24 24"><!-- icône leaderboard --><path d="M4 22h16v-2H4v2zm0-6h10v-2H4v2zm0-6h7V8H4v2zm0-6v2h4V4H4z"/></svg>
      <span class="label">Stats</span>
    </a>
    <a href="game-history.html" class="nav-item" aria-label="Game History">
      <svg class="icon" viewBox="0 0 24 24"><!-- icône history --><path d="M13 3a9 9 0 1 0 9 9h-2a7 7 0 1 1-7-7V3zm-1 5h2v6l5.25 3.15-1 1.65L11 14V8z"/></svg>
      <span class="label">History</span>
    </a>
  </nav>
</body>
</html>
