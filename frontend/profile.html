<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Player Profile</title>
  <link rel="icon" href="images/logo.png" type="image/png">
  <link rel="stylesheet" href="css/global.css">
  <link rel="stylesheet" href="css/profile.css">
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>
  <div class="wrapper">
    <!-- Common navigation bar -->
    <nav class="navbar">
      <div class="nav-container">
        <div class="nav-logo">
          <img src="/images/logo.png" alt="Logo" />
        </div>
        <div id="nav-links" class="nav-links"></div>
      </div>
    </nav>

    <h1 id="playerName">Profile Player1</h1>
    
    <!-- Bouton Logout visible uniquement sur mobile -->
    <button id="mobileLogoutBtn" style="display:none;">Logout</button>

    <div class="filter-buttons">
      <button data-range="7">7 days</button>
      <button data-range="30">30 days</button>
      <button data-range="90" class="active">90 days</button>
      <button data-range="365">1 year</button>
      <button data-range="all">Total</button>
    </div>

    <div id="playerSummary" class="player-summary">
      <p>Elo : <span id="currentElo">...</span></p>
      <p>Global ranking : <span id="globalRank">...</span></p>
    </div>

    <canvas id="eloChart" width="1000" height="500"></canvas>
  </div>

  <script type="module" src="js/profile.js"></script>

  <!-- Back to Top Button -->
  <button id="backtotopBtn" title="Back to top">↑</button>
  <script src="js/global.js"></script>
  
  <!-- Bottom Navigation Bar pour mobile -->
  <nav class="bottom-nav"></nav>
  <script type="module" src="/js/navbar-controller.js"></script>
</body>
</html>
