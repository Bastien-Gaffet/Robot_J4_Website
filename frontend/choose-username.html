<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Choose your username</title>
  <link rel="icon" href="images/logo.png" type="image/png" />
  <link rel="stylesheet" href="css/global.css" />
  <link rel="stylesheet" href="css/choose-username.css" />
</head>
<body>
  <!-- Common navigation bar -->
  <nav class="navbar">
    <div class="nav-container">
      <div class="nav-logo">
        <img src="/images/logo.png" alt="Logo" />
      </div>
      <div id="nav-links" class="nav-links"></div>
    </div>
  </nav>

  <!-- Mobile top-navigation bar -->
  <div id="top-mobile-navbar" class="top-mobile-navbar"></div>

  <div class="container">
      <!-- Tabs -->
    <div class="tab-bar">
      <button class="tab active" data-mode="new">Choose Username</button>
      <button class="tab" data-mode="claim">Claim Username</button>
    </div>
    <h1>Choose Your Username</h1>
    <input type="text" id="pseudo" placeholder="Enter your username" />
    
    <div id="claim-token-section" style="display:none;">
      <input type="text" id="claim-token" placeholder="Enter your claim token" />
    </div>

    <button id="submit-btn">Continue</button>
    <div id="error-message" class="error"></div>
  </div>

  <h2>Select Your Avatar</h2>
  <div class="avatar-selection" id="avatar-selection">
    <!-- JS injectera les avatars ici -->
  </div>
  <input type="hidden" id="selected-avatar" />

  <script type="module" src="js/auth-guard.js"></script>
  <script type="module" src="js/choose-username.js"></script>

  <!-- Back to Top Button -->
  <button id="backtotopBtn" title="Back to top">↑</button>
  <script src="js/global.js"></script>
  
  <!-- Bottom Navigation Bar pour mobile -->
  <nav class="bottom-nav"></nav>
  <script type="module" src="/js/navbar-controller.js"></script>
</body>
</html>
