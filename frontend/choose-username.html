<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Choose your username</title>
  <link rel="icon" href="images/logo.png" type="image/png" />
  <link rel="stylesheet" href="css/global.css" />
  <link rel="stylesheet" href="css/choose-username.css" />
</head>
<body>
  <!-- Common navigation bar -->
  <nav class="navbar">
    <div class="nav-container">
      <div class="nav-logo">
        <img src="images/logo.png" alt="Logo" height="40" />
      </div>
      <div class="nav-links">
        <a href="index.html">Home</a>
        <a href="login.html"  class="active">Play</a>
        <a href="leaderboard.html">Leaderboard</a>
        <a href="game-history.html">Game history</a>
      </div>
    </div>
  </nav>

  <div class="container">
      <!-- Tabs -->
    <div class="tab-bar">
      <button class="tab active" data-mode="new">Choose Username</button>
      <button class="tab" data-mode="claim">Claim Username</button>
    </div>
    <h1>Choose Your Username</h1>
    <input type="text" id="pseudo" placeholder="Enter your username" />
    
    <div id="claim-token-section" style="display:none;">
      <input type="text" id="claim-token" placeholder="Enter your claim token" />
    </div>

    <button id="submit-btn">Continue</button>
    <div id="error-message" class="error"></div>
  </div>

  <script type="module" src="js/auth-guard.js"></script>
  <script type="module" src="js/choose-username.js"></script>

  <!-- Back to Top Button -->
  <button id="backtotopBtn" title="Back to top">↑</button>
  <script src="js/global.js"></script>

  <!-- Bottom Navigation Bar pour mobile -->
  <nav class="bottom-nav">
    <a href="index.html" class="nav-item" aria-label="Home">
      <svg class="icon" viewBox="0 0 24 24"><!-- icône home --><path d="M3 12l9-9 9 9v9a1 1 0 0 1-1 1h-5v-6h-6v6H4a1 1 0 0 1-1-1v-9z"/></svg>
      <span class="label">Home</span>
    </a>
    <a href="home.html" class="nav-item" aria-label="Play">
      <svg class="icon" viewBox="0 0 24 24"><!-- icône play --><path d="M8 5v14l11-7z"/></svg>
      <span class="label">Play</span>
    </a>
    <a href="leaderboard.html" class="nav-item" aria-label="Leaderboard">
      <svg class="icon" viewBox="0 0 24 24"><!-- icône leaderboard --><path d="M4 22h16v-2H4v2zm0-6h10v-2H4v2zm0-6h7V8H4v2zm0-6v2h4V4H4z"/></svg>
      <span class="label">Stats</span>
    </a>
    <a href="game-history.html" class="nav-item active" aria-label="Game History">
      <svg class="icon" viewBox="0 0 24 24"><!-- icône history --><path d="M13 3a9 9 0 1 0 9 9h-2a7 7 0 1 1-7-7V3zm-1 5h2v6l5.25 3.15-1 1.65L11 14V8z"/></svg>
      <span class="label">History</span>
    </a>
  </nav>
</body>
</html>
