<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Puissance 4 Multijoueur</title>
  <link rel="icon" href="images/logo.png" type="image/png">
  <link rel="stylesheet" href="css/global.css" />
  <link rel="stylesheet" href="css/login.css" />
  <!-- FirebaseUI CSS -->
  <link type="text/css" rel="stylesheet" href="https://www.gstatic.com/firebasejs/ui/6.0.2/firebase-ui-auth.css" />
</head>
<body>
  <!-- Common navigation bar -->
  <nav class="navbar">
    <div class="nav-container">
      <div class="nav-logo">
        <img src="/images/logo.png" alt="Logo" />
      </div>
      <div id="nav-links" class="nav-links"></div>
    </div>
  </nav>

  <!-- Mobile top-navigation bar -->
  <div id="top-mobile-navbar" class="top-mobile-navbar"></div>

  <h1>Welcome!</h1>
  <h3>Sign in or create a new account to start playing.</h3>
  <h1 style="text-align:center;">Connect to your account</h1>
  <div id="firebaseui-auth-container"></div>

  <!-- Firebase SDK (compat) -->
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>

  <!-- FirebaseUI -->
  <script src="https://www.gstatic.com/firebasejs/ui/6.0.2/firebase-ui-auth.js"></script>

  <!-- Puis la redirection si déjà connecté -->
  <script type="module" src="js/redirect-if-authenticated.js"></script>

  <!-- Ton init FirebaseUI -->
  <script src="js/firebaseui-init.js"></script>
  
  <!-- Back to Top Button -->
  <button id="backtotopBtn" title="Back to top">↑</button>
  <script src="js/global.js"></script>
  
  <!-- Bottom Navigation Bar pour mobile -->
  <nav class="bottom-nav"></nav>
  <script type="module" src="/js/navbar-controller.js"></script>
</body>
</html>
