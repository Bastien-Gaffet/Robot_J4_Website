<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Connect4 Multiplayer</title>
  <link rel="icon" href="images/logo.png" type="image/png">
  <link rel="stylesheet" href="css/global.css" />
  <link rel="stylesheet" href="css/replay.css" />
</head>
<body>
  <!-- Common navigation bar -->
  <nav class="navbar">
    <div class="nav-container">
      <div class="nav-logo">
        <img src="/images/logo.png" alt="Logo" />
      </div>
      <div id="nav-links" class="nav-links"></div>
    </div>
  </nav>

  <h1>Connect4 online game</h1>
  <p id="status" style="text-align:center; font-weight:bold; color: red; margin-top: 0.5em;"></p>
  <div id="grid"></div>
  <div id="info" style="text-align:center; margin-top: 10px;">
    <span>Tu es : <span id="player-color">-</span></span> |
    <span id="turn-indicator">En attente...</span>
  </div>

  <!-- Popup victoire -->
  <div id="popup" class="hidden">
    <div class="popup-content">
      <p id="popup-message"></p>
      <button id="popup-close">OK</button>
    </div>
  </div>
  <!-- Back to Top Button -->
  <button id="backtotopBtn" title="Back to top">↑</button>
  <script src="js/global.js"></script>
  
  <!-- Bottom Navigation Bar pour mobile -->
  <nav class="bottom-nav"></nav>
  <script type="module" src="/js/navbar-controller.js"></script>

  <script type="module" src="js/auth-guard.js"></script>
  <script type="module" src="js/play.js"></script>
</body>
</html>
