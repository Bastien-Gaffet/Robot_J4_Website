<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Replay game</title>
  <link rel="icon" href="images/logo.png" type="image/png">
  <link rel="stylesheet" href="css/global.css" />
  <link rel="stylesheet" href="css/replay.css">
</head>
<body>
  <!-- Common navigation bar -->
  <nav class="navbar">
    <div class="nav-container">
      <div class="nav-logo">
        <img src="images/logo.png" alt="Logo" height="40" />
      </div>
      <div class="nav-links">
        <a href="index.html">Home</a>
        <a href="leaderboard.html">Leaderboard</a>
        <a href="game-history.html">Game history</a>
      </div>
    </div>
  </nav>

  <h1>Game Replay Visualization</h1>
  <p id="grid-message" class="grid-message hidden">Aucune partie spécifiée</p>
  <div id="replay-container" class="replay-container">
  <div id="legend" class="legend">
    <div class="legend-item">
      <span class="legend-color red"></span>
      Algorithm Red
    </div>
    <div class="legend-item">
      <span class="legend-color yellow"></span>
      Player Yellow
    </div>
  </div>
  <div id="grid"></div>
  </div>

  <div id="controls">
    <button id="rewind" aria-label="Rewind">
      <img src="images/svg/arrow-left-double.svg" alt="Rewind">
    </button>
    <button id="previous" aria-label="Previous">
      <img src="images/svg/arrow-left.svg" alt="Previous">
    </button>
    <button id="playpause" aria-label="Play/Pause">
      <img id="playpause-img" src="images/svg/play.svg" alt="Play">
    </button>
    <button id="next" aria-label="Next">
      <img src="images/svg/arrow-right.svg" alt="Next">
    </button>
    <button id="end" aria-label="End">
      <img src="images/svg/arrow-right-double.svg" alt="End">
    </button>
  </div>

  <!-- Popup personnalisé -->
  <div id="popup" class="hidden">
    <div class="popup-content">
      <p id="popup-message">Player Red (Algorithm) wins!</p>
      <button id="popup-close">OK</button>
    </div>
  </div>

  <script type="module" src="js/replay.js"></script>

  <!-- Back to Top Button -->
  <button id="backtotopBtn" title="Back to top">↑</button>
  <script src="js/global.js"></script>
  <!-- Footer -->
  <footer>
    <p>Presented by the Lycée Vaucanson Robot J4 Team<br>from Tours in 2025</p>
  </footer>
    <!-- Bottom Navigation Bar pour mobile -->
  <nav class="bottom-nav">
    <a href="index.html" class="nav-item" aria-label="Home">
      <svg class="icon" viewBox="0 0 24 24"><!-- icône home --><path d="M3 12l9-9 9 9v9a1 1 0 0 1-1 1h-5v-6h-6v6H4a1 1 0 0 1-1-1v-9z"/></svg>
      <span class="label">Home</span>
    </a>
    <a href="replay.html" class="nav-item active" aria-label="Play">
      <svg class="icon" viewBox="0 0 24 24"><!-- icône play --><path d="M8 5v14l11-7z"/></svg>
      <span class="label">Play</span>
    </a>
    <a href="leaderboard.html" class="nav-item" aria-label="Leaderboard">
      <svg class="icon" viewBox="0 0 24 24"><!-- icône leaderboard --><path d="M4 22h16v-2H4v2zm0-6h10v-2H4v2zm0-6h7V8H4v2zm0-6v2h4V4H4z"/></svg>
      <span class="label">Stats</span>
    </a>
    <a href="game-history.html" class="nav-item" aria-label="Game History">
      <svg class="icon" viewBox="0 0 24 24"><!-- icône history --><path d="M13 3a9 9 0 1 0 9 9h-2a7 7 0 1 1-7-7V3zm-1 5h2v6l5.25 3.15-1 1.65L11 14V8z"/></svg>
      <span class="label">History</span>
    </a>
  </nav>
</body>
</html>
