<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Leaderboard</title>
  <link rel="icon" href="images/logo.png" type="image/png">
  <link rel="stylesheet" href="css/global.css" />
  <link rel="stylesheet" href="css/game-history.css">
</head>
<body>
  <!-- Common navigation bar -->
  <nav class="navbar">
    <div class="nav-container">
      <div class="nav-logo">
        <img src="/images/logo.png" alt="Logo" />
      </div>
      <div id="nav-links" class="nav-links"></div>
    </div>
  </nav>

  <!-- Mobile top-navigation bar -->
  <div id="top-mobile-navbar" class="top-mobile-navbar"></div>

  <h1>Game History</h1>
  <div class="search-container">
    <input type="text" id="searchInput" placeholder="Search a game..." />
  </div>
  <div class="table-container">
    <table id="leaderboard">
      <thead>
        <tr>
          <th data-key="player_pseudo">Username <img class="sort-icon" src="images/svg/sort-neutral.svg" /></th>
          <th data-key="timestamp">Date <img class="sort-icon" src="images/svg/sort-neutral.svg" /></th>
          <th data-key="duration_seconds">Duration <img class="sort-icon" src="images/svg/sort-neutral.svg" /></th>
          <th data-key="ai_depth">AI Level <img class="sort-icon" src="images/svg/sort-neutral.svg" /></th>
          <th>Winner</th>
          <th>Replay</th>
        </tr>
      </thead>
      <tbody></tbody>
    </table>
    <div id="pagination" class="pagination">
      <!-- Les boutons seront insérés dynamiquement par JS -->
    </div>
  </div>

  <script type="module" src="js/game-history.js"></script>

  <!-- Back to Top Button -->
  <button id="backtotopBtn" title="Back to top">↑</button>
  <script src="js/global.js"></script>
  
  <!-- Bottom Navigation Bar pour mobile -->
  <nav class="bottom-nav"></nav>
  <script type="module" src="/js/navbar-controller.js"></script>
</body>
</html>
