<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Player Profile</title>
  <link rel="icon" href="images/logo.png" type="image/png">
  <link rel="stylesheet" href="css/global.css">
  <link rel="stylesheet" href="css/account.css">
</head>
<body>
  <!-- Common navigation bar -->
  <nav class="navbar">
    <div class="nav-container">
    <div class="nav-logo">
      <img src="/images/logo.png" alt="Logo" />
    </div>
    <div id="nav-links" class="nav-links"></div>
    </div>
  </nav>

  <!-- Mobile top-navigation bar -->
  <div id="top-mobile-navbar" class="top-mobile-navbar"></div>

  <wrapper>
    <p>Email : <span id="user-email"></span></p>

    <input id="pseudo" type="text" placeholder="Your pseudo" maxlength="16">
    <input type="hidden" id="selected-avatar">

    <h2>Select Your Avatar</h2>
    <div class="avatar-selection" id="avatar-selection"></div>

    <button id="save-btn">Save changes</button>
    <button id="delete-btn">Delete my Account</button>
  </wrapper>
  <!-- Account Deletion Confirmation Popup -->
  <div id="delete-popup" class="confirm-popup">
    <div class="confirm-popup-content">
      <h3>Are you sure you want to delete your account?</h3>
      <p>This action is permanent and cannot be undone.</p>
      <p>To confirm the deletion of your account, type your username below:</p>
      <input type="text" id="confirm-pseudo-input" placeholder="Your username" />
      <button class="confirm" id="confirm-delete">Yes, delete</button>
      <button class="cancel" id="cancel-delete">Cancel</button>
    </div>
  </div>
  <!-- Back to Top Button -->
  <button id="backtotopBtn" title="Back to top">↑</button>
  <script src="js/global.js"></script>
  
  <!-- Bottom Navigation Bar pour mobile -->
  <nav class="bottom-nav"></nav>

  <script type="module" src="/js/navbar-controller.js"></script>
  <script type="module" src="/js/account.js"></script>
</body>
</html>
